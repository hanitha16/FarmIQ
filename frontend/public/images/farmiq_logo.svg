<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Badge Boundary -->
  <path d="M 170 170 A 100 100 0 1 1 315 130" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/>

  <!-- Wi-Fi Signal Arcs Top Right -->
  <path d="M 285 70 A 35 35 0 0 1 315 100" fill="none" stroke="#064e3b" stroke-width="6" stroke-linecap="round"/>
  <path d="M 295 55 A 50 50 0 0 1 335 95" fill="none" stroke="#064e3b" stroke-width="6" stroke-linecap="round"/>
  <path d="M 305 40 A 65 65 0 0 1 355 90" fill="none" stroke="#064e3b" stroke-width="6" stroke-linecap="round"/>

  <!-- Sun Rays & Rising Sun -->
  <circle cx="250" cy="140" r="24" fill="url(#sunGrad)" />
  <line x1="250" y1="104" x2="250" y2="96" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>
  <line x1="222" y1="114" x2="216" y2="108" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>
  <line x1="278" y1="114" x2="284" y2="108" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>
  <line x1="208" y1="138" x2="200" y2="138" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>
  <line x1="292" y1="138" x2="300" y2="138" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>

  <!-- Furrowed Fields -->
  <path d="M 155 160 C 200 185, 290 185, 335 150 C 310 190, 210 200, 155 160 Z" fill="url(#fieldGrad)" />
  <path d="M 160 172 C 210 195, 280 195, 330 162" fill="none" stroke="#84cc16" stroke-width="5" stroke-linecap="round"/>

  <!-- Twin Leaves Sprout -->
  <path d="M 230 155 C 230 110, 205 80, 170 85 C 170 120, 195 150, 230 155 Z" fill="url(#leafGrad)"/>
  <path d="M 230 155 C 235 100, 260 70, 295 75 C 295 110, 265 145, 230 155 Z" fill="url(#leafGrad)"/>
  <path d="M 230 155 L 230 170" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>

  <!-- Brand Text: FarmIQ -->
  <text x="60" y="275" font-family="'Outfit', sans-serif" font-weight="900" font-size="92" fill="#064e3b" letter-spacing="-2">Farm</text>
  <text x="315" y="275" font-family="'Outfit', sans-serif" font-weight="900" font-size="92" fill="#84cc16" letter-spacing="-2">IQ</text>
  <!-- Q Leaf Accent inside Q -->
  <path d="M 405 235 C 425 210, 445 220, 435 245 C 415 255, 395 245, 405 235 Z" fill="#16a34a"/>

  <!-- Underline Tagline -->
  <line x1="75" y1="305" x2="115" y2="305" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
  <text x="125" y="310" font-family="'Outfit', sans-serif" font-weight="700" font-size="20" fill="#064e3b" letter-spacing="1">Smarter Farming Smarter Decisions</text>
  <line x1="420" y1="305" x2="455" y2="305" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
</svg>
